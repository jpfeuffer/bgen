name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-cmake:
    name: CMake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-all-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libzstd-dev \
            ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install boost sqlite zstd ninja

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBGEN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install (dry-run)
        run: cmake --install build --prefix build/install

      - name: Verify CMake package config
        run: |
          cmake -S /dev/null -B /tmp/find_test \
            -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install \
            -DFIND_PACKAGE_MESSAGE_DETAILS_bgen=ON \
            -P /dev/null 2>&1 || true
          # Simple check that config files were installed
          test -f build/install/lib/cmake/bgen/bgenConfig.cmake
          test -f build/install/lib/cmake/bgen/bgenTargets.cmake

  build-pixi:
    name: Pixi package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.44.0

      - name: Build conda package
        run: pixi build

      - name: Run pixi tasks (configure, build, test)
        run: pixi run test
