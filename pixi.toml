[workspace]
name = "bgen-cpp"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]

[dependencies]
cmake = ">=3.25"
ninja = "*"
boost-cpp = ">=1.84"
zlib = "*"
zstd = "*"
sqlite = "*"

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DBGEN_BUILD_TESTS=ON"
build     = { cmd = "cmake --build build --parallel", depends-on = ["configure"] }
test      = { cmd = "ctest --test-dir build --output-on-failure -V", depends-on = ["build"] }

[feature.s3.dependencies]
aws-sdk-cpp = "*"

[feature.s3.tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DBGEN_BUILD_TESTS=ON -DBGEN_WITH_S3=ON"
test-s3   = { cmd = "ctest --test-dir build --output-on-failure -V -R test_s3_bgen", depends-on = ["build"] }

[environments]
default = { solve-group = "default" }
s3 = { features = ["s3"], solve-group = "default" }

[package]
name = "bgen-cpp"
version = "1.1.7"

[package.build]
backend = { name = "pixi-build-cmake", version = "0.*" }

[package.build.config]
extra-args = ["-DCMAKE_BUILD_TYPE=Release"]

[package.host-dependencies]
boost-cpp = ">=1.84"
zlib = "*"
zstd = "*"
sqlite = "*"

[package.run-dependencies]
boost-cpp = ">=1.84"
zlib = "*"
zstd = "*"
sqlite = "*"

