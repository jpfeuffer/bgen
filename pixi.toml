[workspace]
name = "bgen"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
preview = ["pixi-build"]

[dependencies]
bgen = { path = "." }
cmake = ">=3.25"
ninja = "*"
boost-cpp = ">=1.84"
zlib = "*"
zstd = "*"
sqlite = "*"

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DBGEN_BUILD_TESTS=ON"
build     = { cmd = "cmake --build build --parallel", depends-on = ["configure"] }
test      = { cmd = "ctest --test-dir build --output-on-failure -V", depends-on = ["build"] }

[package]
name = "bgen"
version = "1.1.7"

[package.build]
backend = { name = "pixi-build-cmake", version = "0.*" }

[package.build.config]
extra-args = ["-DCMAKE_BUILD_TYPE=Release"]

[package.host-dependencies]
boost-cpp = ">=1.84"
zlib = "*"
zstd = "*"
sqlite = "*"

[package.run-dependencies]
boost-cpp = ">=1.84"
zlib = "*"
zstd = "*"
sqlite = "*"

